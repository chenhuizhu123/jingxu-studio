name: Verify and build all clients
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:desktop
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        run: npm run package:win
      - if: runner.os != 'Linux'
        run: npm run test:package
      - if: runner.os == 'Windows'
        run: npm run test:win:structure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            coverage/
            playwright-report/
            test-results/
            release/*.*
  mobile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: 21
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - if: runner.os == 'macOS'
        run: flutter test --no-pub --coverage
      # The committed snapshots use macOS font rasterization. Ubuntu still
      # executes every functional assertion in the widget test files.
      - if: runner.os == 'Linux'
        run: flutter test --no-pub --coverage --dart-define=JINGXU_COMPARE_GOLDENS=false
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - if: runner.os == 'Linux'
        run: npm ci
        working-directory: .
      - if: runner.os == 'Linux'
        run: npm run test:interop
        working-directory: .
      - if: runner.os == 'Linux'
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - if: runner.os == 'Linux'
        run: npm run mobile:verify:android
        working-directory: .
      - if: runner.os == 'macOS'
        run: flutter build ios --simulator --debug
      - if: runner.os == 'macOS'
        run: npm run mobile:verify:ios-simulator
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-${{ runner.os }}
          path: |
            apps/mobile/coverage/
            apps/mobile/build/app/outputs/flutter-apk/*.apk
            apps/mobile/build/ios/iphonesimulator/*.app
            artifacts/package-interop/report.json
            release/*android*preview.apk
            release/checks/android-*.json
            release/*ios-simulator-preview.zip
            release/checks/ios-simulator-*.json
